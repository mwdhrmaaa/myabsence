<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Full-bleed background -->
  <rect width="512" height="512" fill="url(#grad)" />
  
  <!-- Glowing Circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#6366f1" stroke-width="12" stroke-opacity="0.4" filter="url(#glow)" />
  
  <!-- Stylized 'A' -->
  <path d="M180 380 L256 120 L332 380 M210 320 L302 320" fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Checkmark -->
  <path d="M220 280 L260 330 L350 200" fill="none" stroke="#10b981" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
