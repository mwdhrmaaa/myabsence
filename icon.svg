<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Full-bleed background -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  
  <!-- Sophisticated Double Ring -->
  <circle cx="256" cy="256" r="225" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.1" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#6366f1" stroke-width="8" stroke-opacity="0.5" filter="url(#glow)" />
  
  <!-- Centered 'A' and Checkmark Integration -->
  <g transform="translate(256, 260)">
    <!-- Stylized A -->
    <path d="M-90,110 L0,-110 L90,110 M-60,40 L60,40" fill="none" stroke="white" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9" filter="url(#glow)"/>
    
    <!-- Bold Integrated Checkmark -->
    <path d="M-60,30 L0,90 L120,-50" fill="none" stroke="#10b981" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
</svg>
